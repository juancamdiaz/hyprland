# font_family	Agave Nerd Font
font_size	15
	
disable_ligatures	no
enable_audio_bell	no
	
shell	zsh
shell_integration	enable
	
cursor_shape	block
	
url_style	curly
	
remember_window_size	no
initial_window_width	640
initial_window_height	480
window_padding_width	10
cursor_blink_interval	0
	
background_opacity	0.9
scrollbar_handle_opacity 	0.50
scrollbar_track_opacity 	0.50
scrollbar_track_hover_opacity 	0.50
confirm_os_window_close	0
	
sync_to_monitor	no


# Theme
background            	#323232
foreground            	#ffffff
cursor                	#d6d6d6
selection_background  	#5b5b5b
selection_foreground  	#323232
color0                	#353535
color8                	#535353
color1                	#d25252
color9                	#f00c0c
color2                	#a4c161
color10               	#c1df74
color3                	#ffc56d
color11               	#e1e48a
color4                	#6c99ba
color12               	#8ab6d9
color5                	#d096d9
color13               	#efb5f7
color6                	#bdd6ff
color14               	#dbf4ff
color7                	#ededec
color15               	#ffffff
active_tab_foreground   #ffffff
active_tab_background   #535353
inactive_tab_foreground #ffffff
inactive_tab_background #353535


# BEGIN_KITTY_FONTS
font_family      family="Agave Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
