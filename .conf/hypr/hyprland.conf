$terminal = kitty
$menu = rofi -show drun
$fileManager = nemo
$M1 = DP-1
$M2 = HDMI-A-1

misc {
font_family = Agave Nerd Font, Sans
#autorecarga, deshabilitada para que no encienda el segundo monitor
#disable_autoreload = true
}
#atajo de recarga temporal
bind = SUPER SHIFT, R, exec, hyprctl reload


# Atajos---
bind = SUPER, Q, exec, $terminal
bind = SUPER, E, exec, $fileManager
bind = SUPER, R, exec, pkill rofi || ~/.config/rofi/launchers/type-3/launcher.sh
bind = SUPER, C, killactive
bind = SUPER, M, exit,

#screeenshoots
bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy #screenshot de área y copia al portapapeles

# Control de Volumen
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

#calculadora
bind = , XF86Calculator, exec, $terminal nasc

# Menú de Apagado
#bind = SUPER, Escape, exec, pkill rofi || ~/.config/hypr/powermenu.sh
bind = SUPER, Escape, exec, pkill wlogout || wlogout

# Teclado---
input {
kb_layout = es
numlock_by_default = true
}


# Monitores---
monitor = $M1, 2560x1440@143.97, 0x0, 1
monitor = $M2, 1920x1080@100, 2560x0, 1, transform, 3

#Solo monitor 1
bind = SUPER SHIFT, F1, exec, hyprctl keyword monitor "$M1, 2560x1440@143.97, 0x0, 1" && hyprctl keyword monitor "$M2, disable"
#Solo monitor 2
bind = SUPER SHIFT, F2, exec, hyprctl keyword monitor "$M2, 1920x1080@100, 2560x0, 1, transform, 3" && hyprctl keyword monitor "$M1, disable"
#Ambos monitores
bind = SUPER SHIFT, F3, exec, hyprctl keyword monitor "$M1, 2560x1440@143.97, 0x0, 1" && hyprctl keyword monitor "$M2, 1920x1080@100, 2560x0, 1, transform, 3"



#Workspaces---
workspace = 1, monitor:$M1, default:true
workspace = 2, monitor:$M1
workspace = 3, monitor:$M1

workspace = 4, monitor:$M2, default:true
workspace = 5, monitor:$M2
workspace = 6, monitor:$M2

#atajos workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER SHIFT, 1, movetoworkspace, 1
    bind = SUPER, 2, workspace, 2
    bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER SHIFT, 3, movetoworkspace, 3
    bind = SUPER, 4, workspace, 4
    bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 5, movetoworkspace, 5
    bind = SUPER, 6, workspace, 6
    bind = SUPER SHIFT, 6, movetoworkspace, 6


# Autostart Applications
exec-once = waybar
exec-once = awww-daemon
exec-once = swaync
exec-once = blueman-applet
exec-once = wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.80

#exec-once = tutanota-desktop

#Agente de autenticación
exec-once = systemctl --user start hyprpolkitagent
exec-once = quickshell

# Iniciar el agente de autenticación Polkit
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# Iniciar los componentes del llavero de GNOME
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11,secrets,ssh

#Visual
general {
gaps_in = 2
#gaps_out = 2
gaps_out = 4
border_size = 3
col.active_border = rgb(BD57BD) rgb(9C629C) 45deg
col.inactive_border = rgba(595959aa)

layout = dwindle #dwindle o master
}

decoration {
rounding = 7
}

# GESTIÓN DE VENTANAS

# Alternar entre ventana flotante y modo mosaico (Tiling)
bind = SUPER, V, togglefloating,

# Alternar modo pantalla completa (Fullscreen)
bind = SUPER, F, fullscreen, 0

# Cambiar el foco entre ventanas (Estilo Vim o Flechas)
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Mover la ventana activa de posición en el mosaico
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# Mover ventanas flotantes con el ratón
# Mantén presionado SUPER + Clic Izquierdo para arrastrar
bindm = SUPER, mouse:272, movewindow
# Mantén presionado SUPER + Clic Derecho para redimensionar
bindm = SUPER, mouse:273, resizewindow


#NVDIA
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

#Workspaces especiales
#bind = SUPER, D, movetoworkspace, special
#bind = SUPER SHIFT, D, togglespecialworkspace,


# Habilitar el comportamiento flotante
windowrule = match:class ^(mpv)$, float true
# Definir el tamaño fijo del reproductor mini
windowrule = match:class ^(mpv)$, size 400 225
# Moverlo a la esquina inferior derecha (monitor local)
windowrule = match:class ^(mpv)$, move (monitor_w-410) (monitor_h-1400)
# Fijarlo para que persista visible en todos los espacios de trabajo
windowrule = match:class ^(mpv)$, pin true
