$terminal = kitty
$menu = rofi -show drun
$fileManager = dolphin

misc {
font_family = Agave Nerd Font, Sans
}


# Atajos---
bind = SUPER, Q, exec, $terminal
bind = SUPER, E, exec, $fileManager
bind = SUPER, R, exec, ~/.config/rofi/launchers/type-3/launcher.sh
bind = SUPER, C, killactive
bind = SUPER, M, exit,
#screeenshoots
bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
# Control de Volumen
bindel = , F12, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle


# Teclado---
input {
kb_layout = es
numlock_by_default = true
}


# Monitores---
monitor = DP-2, 2560x1440@143.97, 0x0, 1
monitor = HDMI-A-2, 1920x1080@100, 2560x0, 1, transform, 3


#Workspaces---
workspace = 1, monitor:DP-2, default:true
workspace = 2, monitor:DP-2
workspace = 3, monitor:HDMI-A-2

#atajos workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER SHIFT, 1, movetoworkspace, 1

bind = SUPER, 2, workspace, 2
bind = SUPER SHIFT, 2, movetoworkspace, 2

bind = SUPER, 3, workspace, 3
bind = SUPER SHIFT, 3, movetoworkspace, 3


# Autostart Applications
exec-once = waybar
exec-once = awww-daemon
exec-once = swaync
exec-once = blueman-applet
exec-once = wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.80
#Agente de autenticación
exec-once = systemctl --user start hyprpolkitagent

#Visual
general {
gaps_in = 2
gaps_out = 2
border_size = 3
col.active_border = rgb(BD57BD) rgb(9C629C) 45deg
col.inactive_border = rgba(595959aa)

layout = dwindle #dwindle o master
}

decoration {
rounding = 7
}

# GESTIÓN DE VENTANAS

# Alternar entre ventana flotante y modo mosaico (Tiling)
bind = SUPER, V, togglefloating,

# Alternar modo pantalla completa (Fullscreen)
bind = SUPER, F, fullscreen, 0

# Cambiar el foco entre ventanas (Estilo Vim o Flechas)
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Mover la ventana activa de posición en el mosaico
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# Mover ventanas flotantes con el ratón
# Mantén presionado SUPER + Clic Izquierdo para arrastrar
bindm = SUPER, mouse:272, movewindow
# Mantén presionado SUPER + Clic Derecho para redimensionar
bindm = SUPER, mouse:273, resizewindow


# Menú de Apagado
bind = SUPER, Escape, exec, ~/.config/hypr/powermenu.sh

#NVDIA
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

