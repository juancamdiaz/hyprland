$terminal = kitty
$menu = rofi -show drun
$fileManager = dolphin

# Atajos
bind = SUPER, Q, exec, $terminal
bind = SUPER, E, exec, $fileManager
bind = SUPER, R, exec, ~/.config/rofi/launchers/type-3/launcher.sh
bind = SUPER, C, killactive
bind = SUPER, M, exit,

input {
kb_layout = es
numlock_by_default = true
}

misc{
font_family = Agave Nerd Font, Sans
}


# Monitores
monitor = DP-2, 2560x1440@200, 0x0, 1
monitor = HDMI-A-2, 1920x1080@100, 2560x0, 1, transform, 3

workspace = 1, monitor:DP-2, default:true
workspace = 2, monitor:HDMI-A-2

# Ejecutar Waybar al inicio
exec-once = waybar
exec-once = awww-daemon
exec-once = swaync
exec-once = blueman-applet

#Visual
general {
  gaps_in = 2
  gaps_out = 7

  border_size = 2
}

decoration {
rounding = 3
}

# GESTIÓN DE VENTANAS

# Alternar entre ventana flotante y modo mosaico (Tiling)
bind = SUPER, V, togglefloating,

# Alternar modo pantalla completa (Fullscreen)
bind = SUPER, F, fullscreen, 0

# Cambiar el foco entre ventanas (Estilo Vim o Flechas)
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Mover la ventana activa de posición en el mosaico
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# Mover ventanas flotantes con el ratón
# Mantén presionado SUPER + Clic Izquierdo para arrastrar
bindm = SUPER, mouse:272, movewindow
# Mantén presionado SUPER + Clic Derecho para redimensionar
bindm = SUPER, mouse:273, resizewindow


# Menú de Apagado
bind = SUPER, Escape, exec, ~/.config/hypr/powermenu.sh
